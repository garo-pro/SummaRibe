[project]
name = "summaribe"
version = "0.1.0"
description = "Modular pipeline app: download audio, transcribe, AI-improve and summarize, with a wxPython GUI and a CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "garo", email = "games.garos.mail@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7",
    "httpx>=0.27",
    "yt-dlp>=2024.8.6",
    "pydantic>=2.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
gui = ["wxpython>=4.2.1"]
whisper = ["faster-whisper>=1.0.3"]
parakeet = ["nemo_toolkit[asr]>=2.0.0"]
qwen = ["transformers>=4.44", "torch>=2.3", "accelerate>=0.33"]
all = ["summaribe[gui,whisper,parakeet,qwen]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6.2",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
summaribe = "summaribe.cli:app"
summaribe-gui = "summaribe.gui.app:main"

[project.urls]
Homepage = "https://github.com/garo/summaribe"
Issues = "https://github.com/garo/summaribe/issues"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
module-name = "summaribe"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N", "PTH", "PL",
]
ignore = ["PLR0913", "PLR2004", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["summaribe"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]
# Heavy/optional dependencies (ML backends, yt-dlp, wx) are imported lazily by design
# so the CLI/importing the package stays fast and works without every extra installed.
"src/summaribe/transcription/*" = ["PLC0415"]
"src/summaribe/gui/*" = ["PLC0415"]
"src/summaribe/steps/download.py" = ["PLC0415"]
"src/summaribe/cli.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["summaribe"]
mypy_path = "src"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# wxPython ships no type stubs, so every wx.* base class mypy sees is `Any`;
# strict mode's disallow_subclassing_any would otherwise flag every widget subclass.
module = "summaribe.gui.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:wx",
]

[tool.coverage.run]
source = ["src/summaribe"]
omit = ["src/summaribe/gui/*"]
